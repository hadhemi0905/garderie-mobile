# Nom technique du projet (minuscules, underscores)
name: ma_garderie

# Courte description du projet
description: "Application mobile Ma Garderie."

# Empêche de publier accidentellement le projet sur pub.dev
publish_to: 'none'

# Version de l'application : 1.0.0 (numéro de build : 1)
version: 1.0.0+1

# Version de Dart (le langage) requise
environment:
  sdk: ^3.13.4

# Les bibliothèques dont l'application a besoin
dependencies:
  flutter:
    sdk: flutter

  # Icônes de style iOS
  cupertino_icons: ^1.0.8

# Les bibliothèques utilisées seulement pour le développement (tests, règles de code)
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Règles recommandées pour écrire du bon code
  flutter_lints: ^6.0.0

# Section spécifique à Flutter
flutter:

  # Inclut les icônes Material (Icons.home, Icons.add, etc.)
  uses-material-design: true

  # Liste des fichiers (images...) que l'application peut utiliser
  assets:
    - assets/images/garderie.png